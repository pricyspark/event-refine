[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "event-flow"
version = "0.1.0"
description = "Event-Flow RGB and event temporal object detection research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pillow>=10",
  "torch>=2.6",
  "torchvision>=0.21",
  "datasets>=3",
  "huggingface-hub>=1.0",
  "transformers>=5.13,<5.14",
  "scipy>=1.11",
]

[project.optional-dependencies]
prompt-generation = ["openai>=1.68"]
legacy-flow = ["ptlflow==0.4.2", "opencv-python"]
dev = ["pytest>=8", "black>=24"]

[tool.setuptools.packages.find]
include = ["flowsis*", "event_flow*"]

[project.scripts]
event-flow = "event_flow.cli:main"
flowsis-live-detector = "flowsis.cli.deploy.live_detector:main"
flowsis-live-base = "flowsis.cli.deploy.live_base:main"
flowsis-evaluate-detector = "flowsis.cli.eval.evaluate_detector:main"
flowsis-evaluate-base = "flowsis.cli.eval.evaluate_base:main"
flowsis-ablate-base = "flowsis.cli.eval.ablate_base:main"
flowsis-train-detector = "flowsis.cli.train.train_detector:main"
flowsis-train-base = "flowsis.cli.train.train_base:main"
flowsis-visualize-detector-augmentations = "flowsis.cli.train.visualize_detector_augmentations:main"
flowsis-visualize-detection-dataset = "flowsis.cli.data.visualize_hf_detection_dataset:main"
flowsis-author-text-prompts = "flowsis.cli.data.author_text_prompts:main"
flowsis-generate-text-prompts = "flowsis.cli.data.generate_text_prompts:main"
flowsis-embed-text-prompts = "flowsis.cli.data.embed_text_prompts:main"
flowsis-profile-base = "flowsis.cli.eval.profile_base:main"
flowsis-annotate = "flowsis.cli.data.annotate:main"
flowsis-build-annotated-dataset = "flowsis.cli.data.build_annotated_dataset:main"
flowsis-build-temporal-dataset = "flowsis.cli.data.build_temporal_dataset:main"
flowsis-train-temporal = "flowsis.cli.train.train_temporal:main"
flowsis-profile-temporal = "flowsis.cli.eval.profile_temporal:main"
